apiVersion: v1
kind: Service
metadata:
  name: explore-svc-{{ORX_RUN}}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    batch.kubernetes.io/job-name: explore-{{ORX_RUN}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: explore-{{ORX_RUN}}
  labels:
    orx-primary: "true"
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      subdomain: explore-svc-{{ORX_RUN}}
      containers:
        - name: run
          image: nvcr.io/nvidia/pytorch:25.06-py3
          imagePullPolicy: IfNotPresent
          # ORX_SCRIPT contains shell syntax (including semicolons). `eval` is
          # required so bash parses the expanded script instead of treating
          # punctuation as part of a `set` argument.
          command: ["bash", "-c", "eval \"$ORX_SCRIPT\""]
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: ORX_NNODES
              value: "2"
            - name: ORX_MASTER_ADDR
              value: explore-{{ORX_RUN}}-0.explore-svc-{{ORX_RUN}}
            - name: ORX_MASTER_PORT
              value: "29500"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NCCL_DEBUG
              value: WARN
          resources:
            requests:
              nvidia.com/gpu: "8"
              cpu: "48"
              memory: 384Gi
            limits:
              nvidia.com/gpu: "8"
              cpu: "64"
              memory: 512Gi
